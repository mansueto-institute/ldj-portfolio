<footer class="site-footer">
  <div class="wrapper">
    <div class="footer-grid">
      <div>
        <p class="footer-title">{{ site.title | escape }}</p>
        <p>The University of Chicago<br>{{ site.address }}</p>
      </div>
      <div>
        {%- if site.email -%}<p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>{%- endif -%}
        <p><a href="https://www.uchicago.edu">uchicago.edu</a></p>
      </div>
    </div>
    <p class="footer-copy">&copy; {{ 'now' | date: '%Y' }} The University of Chicago</p>
  </div>
</footer>
