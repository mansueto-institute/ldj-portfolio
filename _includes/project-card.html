<li class="project-card">
  {% if include.project.image %}
    <img src="{{ include.project.image | relative_url }}" alt="" loading="lazy">
  {% endif %}
  <div class="project-card-body">
    <h3><a href="{{ include.project.url | relative_url }}">{{ include.project.title }}</a></h3>
    <p>{{ include.project.summary }}</p>
    {% if include.project.status %}<p class="project-status">{{ include.project.status }}</p>{% endif %}
  </div>
</li>
