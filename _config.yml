title: Local Data Journalism Initiative
unit_tagline: Published projects and initiatives from three years of collaboration with local newsrooms.
description: A portfolio of projects from Your Unit Name at the University of Chicago.
email: ganon@uchicago.edu

url: "https://mansueto-institute.github.io"
baseurl: "/ldj-portfolio"

# Pages shown in the navigation, in order
header_pages:
