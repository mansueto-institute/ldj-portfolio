# ---- Edit these -------------------------------------------------------
title: Mansueto Institute Local Data Journalism Project Gallery
description: A portfolio of published projects from the last three years of the Local Data Journalism program.

# Site address. These are set for the mansueto-institute/ldj-portfolio repo.
url: "https://mansueto-institute.github.io"
baseurl: "/ldj-portfolio"

# ---- Theme settings (no need to change) --------------------------------
theme: minima

collections:
  projects:
    output: false   # projects appear on the main page, not as separate pages

plugins:
  - jekyll-seo-tag

exclude: [README.md, Gemfile, Gemfile.lock, vendor]
